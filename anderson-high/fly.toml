# Fly.io config. Change `app` to a unique name (letters, numbers, dashes).
app = "anderson-high-CHANGE-ME"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.checks]
    [http_service.checks.health]
      grace_period = "5s"
      interval = "30s"
      method = "GET"
      path = "/health"
      timeout = "3s"
